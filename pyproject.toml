[tool.poetry]
name = "crypto"
version = "0.1.0"
description = ""
authors = ["hiemenz <kevinhiemenz1@gmail.com>"]
readme = "README.md"
packages = [{ include = "crypto_signal_station" }]

[tool.poetry.dependencies]
python = "^3.11"
pyyaml = "^6.0.2"
yfinance = "^0.2.54"
duckdb = "^1.1.3"
ta = "^0.11.0"
pycoingecko = "^3.2.0"
pandas = "^3.0.1"
mastodon-py = "^2.1.4"
requests-oauthlib = "^2.0.0"
matplotlib = "^3.9.0"
prophet = "^1.1"
lxml = "^6.1.1"
discord-py = "^2.3.2"
anthropic = "^0.40.0"
pillow = "^10.0.0"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
ruamel-yaml = "^0.18.6"

# E Ink display drivers. Optional so the pipeline installs on a laptop, a VPS,
# or CI; display.py is only imported when is_raspberry_pi() is true.
# Install on the Pi with: poetry install --extras eink
spidev = { version = "^3.8", optional = true }
rpi-gpio = { version = "^0.7.1", optional = true }
scikit-learn = "^1.9.0"

[tool.poetry.extras]
eink = ["spidev", "rpi-gpio"]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
