[project]
name = "crypto"
version = "0.1.0"
description = ""
authors = [{ name = "hiemenz", email = "kevinhiemenz1@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.2,<7",
    "yfinance>=0.2.54,<0.3",
    "duckdb>=1.1.3,<2",
    "ta>=0.11.0,<0.12",
    "pycoingecko>=3.2.0,<4",
    "pandas>=3.0.1,<4",
    "mastodon-py>=2.1.4,<3",
    "requests-oauthlib>=2.0.0,<3",
    "matplotlib>=3.9.0,<4",
    "prophet>=1.1,<2",
    "lxml>=6.1.1,<7",
    "discord-py>=2.3.2,<3",
    "anthropic>=0.40.0,<0.41",
    "pillow>=10.0.0,<11",
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.32.0,<0.33",
    "ruamel-yaml>=0.18.6,<0.19",
    "scikit-learn>=1.9.0,<2",
]

[project.optional-dependencies]
# E Ink display driver (shared, from hiemenz-utils). Optional so the pipeline installs on a laptop, a VPS,
# or CI; display.py is only imported when is_raspberry_pi() is true.
# Install on the Pi with: uv sync --extra eink
eink = ["hiemenz-utils[eink] @ git+https://github.com/Hiemenz/hiemenz-utils.git"]

[dependency-groups]
dev = ["pytest>=9.1.1,<10"]

[tool.uv]
package = false
